title: ITGPG — IT Department | Government Polytechnic Gandhinagar
description: Official website of the IT Department at Government Polytechnic Gandhinagar (ITGPG). Find GTU study materials, faculty details, events, and placement records.
baseurl: "/it"
url: "https://itgpg.github.io"
keywords: "ITGPG, Government Polytechnic Gandhinagar IT Department, GPG IT Department, IT diploma Gujarat, polytechnic Gandhinagar, GTU affiliated college, best IT college Gujarat, study materials IT diploma"

# Build settings
markdown: kramdown
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Prevent redirects
exclude: 
  - CNAME
  - Gemfile
  - Gemfile.lock
  - vendor
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - node_modules/

# Collections
collections:
  events:
    output: true
    permalink: /events/:name/
  faculty:
    output: true
  student-corner:
    output: true
  co-curricular:
    output: true
  accreditation:
    output: true
  newsletter:
    output: true




# Default front matter
defaults:
  -
    scope:
      path: ""
    values:
      layout: default
      image: /assets/images/gpg-logo.png
      lang: en_IN 